<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Letter 💌</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f7eafa;
            font-family: Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* =========================
           ENVELOPPE
        ========================= */

        .scene {
            width: 320px;
            height: 400px;
            margin: auto;
            position: relative;
            perspective: 1000px;
        }

        .envelope {
            position: absolute;
            width: 100%;
            height: 200px;
            bottom: 0;
            background: #ff7b90;
            border-radius: 0 0 10px 10px;
        }

        /* =========================
           LA LETTRE
        ========================= */

        .paper {
            position: absolute;
            background: #fffdf9;
            padding: 20px;
            width: 280px;
            min-height: 250px;
            left: 20px;
            top: 50px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: left;
        }

        .message {
            font-size: 16px;
            color: #4a4a4a;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="scene">
            <!-- La lettre papier -->
            <div class="paper">
                <div class="message">
                    love,<br><br>
                    take care | i love you so much<br><br>
                </div>

                </div>
            </div>
            <!-- L'enveloppe -->
            <div class="envelope"></div>
        </div>
    </div>

</body>
</html>
