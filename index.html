<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letter 💌</title>
    <!-- Chargement de la jolie police d'écriture manuscrite -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background: #f7eafa;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 320px;
            text-align: center;
        }
        .scene {
            position: relative;
            width: 300px;
            height: 200px;
            margin: 0 auto 30px auto;
        }
        /* ENVELOPPE DE FOND */
        .envelope {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff7b90;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border-radius: 0 0 10px 10px;
            z-index: 1;
        }
        /* Devant de l'enveloppe */
        .envelope::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 100px solid #ff6984;
            z-index: 3;
            border-radius: 0 0 10px 10px;
        }
        /* Rabat de l'enveloppe */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #ff5e78;
            transform-origin: top;
            transition: transform 0.4s ease;
            z-index: 4;
        }
        /* EFFET OUVERTURE RABAT */
        .scene.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 1;
        }
        /* LA LETTRE PAPIER */
        .paper {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 270px;
            height: 170px;
            background: #fffdf9;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            /* CACHÉ COMPLÈTEMENT AU DÉBUT */
            opacity: 0;
            transform: translateY(0);
            transition: transform 0.5s ease, height 0.5s ease, opacity 0.3s ease;
            z-index: 2;
            text-align: left;
        }
        /* Animation quand on clique sur OPEN */
        .scene.open .paper {
            opacity: 1;
            transform: translateY(-145px);
            height: 230px;
            z-index: 5;
        }
        /* STYLE DU MESSAGE ÉCRIT À LA MAIN */
        .message {
            font-family: 'Great Vibes', cursive;
            font-size: 26px; /* Plus grand pour que l'écriture soit très lisible */
            color: #4a4a4a;
            line-height: 1.4;
        }
        /* BOUTONS COMPLÈTEMENT IDENTIQUES */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 25px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            width: 110px;
        }
        .btn-open {
            background: #cc4452;
            color: white;
            border: none;
        }
        .btn-close {
            background: #f7eafa;
            color: #cc4452;
            border: 2px solid #cc4452;
        }
        .subtitle {
            font-size: 13px;
            color: #b392ac;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Zone de la lettre et enveloppe -->
        <div class="scene" id="letterScene">
            <div class="paper">
                <div class="message">
                    love,<br>
                    was jst thinkin' abt u and wanted to try ts and well ofc u alr know but u mean everything to me i love you so much
                </div>
            </div>
            <div class="envelope"></div>
        </div>

        <!-- Les boutons d'action -->
        <div class="buttons">
            <button class="btn-open" onclick="document.getElementById('letterScene').classList.add('open')">Open</button>
            <button class="btn-close" onclick="document.getElementById('letterScene').classList.remove('open')">Close</button>
        </div>

        <div class="subtitle">A little letter just for you 💗</div>
    </div>

</body>
</html>
